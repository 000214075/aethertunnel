apiVersion: v1
kind: Secret
metadata:
  name: aethertunnel-secrets
  namespace: aethertunnel
  labels:
    app.kubernetes.io/name: aethertunnel
    app.kubernetes.io/component: server
type: Opaque
stringData:
  # Replace both values before applying. The token is the shared secret every
  # client presents, so it is the one credential this deployment cannot generate
  # for itself. Generate one with:
  #   head -c 32 /dev/urandom | base64
  auth-token: "CHANGE-ME-TO-A-RANDOM-TOKEN"
  dashboard-token: "CHANGE-ME-TO-A-DIFFERENT-RANDOM-TOKEN"
