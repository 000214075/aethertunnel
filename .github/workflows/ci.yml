name: CI

# Runs on every push and pull request. The old test workflow ran gosec/golint with
# `@latest` (both unmaintained, and gosec fails the job on any finding), and the
# build workflow tried `go get` on a module that go.mod replaced with a local stub.
# This workflow runs only what the project actually needs: fmt check, vet, tests,
# a bounded fuzz run over the untrusted-input parsers, and a native build on all
# three supported systems.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.25 is the release these jobs are tested on, not a floor set by a
          # dependency: the module's go directive selects 1.24 and the highest
          # requirement any dependency declares is gnark's 1.22 (the post-quantum
          # key agreement needs 1.24 for crypto/mlkem, which is what the module's
          # own directive names). The macOS job also needs a recent linker: 1.22's
          # omitted LC_UUID and the dyld on macos-latest refuses to run such
          # binaries.
          - os: ubuntu-latest
            go: '1.25'
            exe: ''
          - os: windows-latest
            go: '1.25'
            exe: '.exe'
          - os: macos-latest
            go: '1.25'
            exe: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -timeout 300s

      # The tun device binding is compiled only on Linux, so a change there is
      # invisible to a build on any other platform. This cross-build is what keeps
      # every supported target compiling. The 32-bit targets are in the list on
      # purpose: an int-sized constant that overflows on one of them takes the whole
      # build down, and only a 32-bit compile can show it.
      - name: every release target compiles
        if: runner.os == 'Linux'
        run: |
          for target in linux/amd64 linux/arm64 linux/386 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 windows/386; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
            echo "built $target"
          done

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test ./... -count=1 -race -timeout 600s

      # Every parser that reads untrusted bytes, fuzzed for a bounded time. The seed
      # corpus under testdata/fuzz is replayed by `go test ./...` above, which is what
      # keeps an input that once failed from coming back; this step is what looks for
      # new ones. These targets found real bugs the first time they were run — an empty
      # IP packet taken straight from a tunnel frame, and a socks5 domain name that
      # could not be written as host:port — so the budget is not decoration. One target
      # per invocation: go test -fuzz accepts only one.
      - name: the input parsers survive a bounded fuzz run
        if: runner.os == 'Linux'
        run: |
          for target in \
            ./pkg/protocol:FuzzReadFrame \
            ./pkg/protocol:FuzzDecodePunchRequest \
            ./pkg/protocol:FuzzDecodePunchResponse \
            ./pkg/socks:FuzzReadRequest \
            ./pkg/socks:FuzzParseUDPDatagram \
            ./pkg/dht:FuzzDecode \
            ./pkg/vpn:FuzzValidate \
            ./pkg/vpn:FuzzSetIPv4Checksum \
            ./pkg/crypto:FuzzSchnorrVerify \
            ./pkg/crypto:FuzzHybridServerFinish \
            ./pkg/crypto:FuzzCipherOpen \
            ./pkg/crypto:FuzzVerifyIdentity \
            ./pkg/obfs:FuzzRecordRead \
            ./pkg/reliable:FuzzParseSegment
          do
            pkg="${target%%:*}"
            name="${target##*:}"
            echo "fuzzing $name in $pkg"
            # Go can end a bounded run with "context deadline exceeded" instead of a
            # clean PASS when -fuzztime expires while a worker is still executing an
            # input; that is not a finding. A real one writes the input under
            # testdata/fuzz first, or panics, so anything else stays a failure.
            set +e
            output="$(go test "$pkg" -run "^${name}\$" -fuzz "^${name}\$" -fuzztime 10s -count=1 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              if printf '%s' "$output" | grep -q 'Failing input written to'; then
                echo "$name found a failing input" >&2
                exit 1
              fi
              if printf '%s' "$output" | grep -q 'panic:'; then
                echo "$name panicked" >&2
                exit 1
              fi
              if printf '%s' "$output" | grep -q 'context deadline exceeded'; then
                echo "note: $name stopped on the fuzztime deadline rather than cleanly; no input was written"
                continue
              fi
              exit "$status"
            fi
          done

      # The layer-3 path runs on a real tun device, with the two ends in separate
      # network namespaces so that no packet can take a shortcut through the local
      # routing table. It skips itself, with a message, where the runner cannot
      # provide root, /dev/net/tun or a network namespace.
      - name: the layer-3 tunnel carries packets on a real device
        if: runner.os == 'Linux'
        run: |
          go build -o bin/aethertunnel-server .
          go build -o bin/aethertunnel-client ./client
          sudo bash scripts/vpn-linux-test.sh bin/aethertunnel-server bin/aethertunnel-client

      # The same layer-3 path on this runner's own kernel: both ends open real
      # devices (Wintun on Windows, utun on macOS), the addresses the server hands
      # out land on them, and /api/vpn reports the sessions. A packet between two
      # devices on ONE machine cannot prove it entered the driver - the local
      # routing table shortcuts it - so the packet path itself is proven on Linux,
      # which shares every forwarding line with these builds.
      - name: the layer-3 tunnel opens real devices on this runner
        if: runner.os == 'Windows'
        run: |
          go build -o bin/aethertunnel-server.exe .
          go build -o bin/aethertunnel-client.exe ./client
          powershell -ExecutionPolicy Bypass -File scripts\vpn-windows-test.ps1 -Server bin\aethertunnel-server.exe -Client bin\aethertunnel-client.exe

      - name: the layer-3 tunnel opens real devices on this runner
        if: runner.os == 'macOS'
        run: |
          go build -o bin/aethertunnel-server .
          go build -o bin/aethertunnel-client ./client
          sudo bash scripts/vpn-macos-test.sh bin/aethertunnel-server bin/aethertunnel-client

      # -o with an explicit name does not append .exe on Windows, so the suffix is
      # part of the artifact name on every platform.
      - name: build
        run: |
          go build -o bin/aethertunnel-server${{ matrix.exe }} .
          go build -o bin/aethertunnel-client${{ matrix.exe }} ./client

      # The same kinds of paths scripts/smoke-test.ps1 drives on Windows, run here
      # against these binaries on this kernel: the proxy types, the private proxies
      # and their visitors, the socks5 exit and its target policy, the counters, the
      # audit log, and every security layer at once. macOS is left out because the
      # script is written for Linux; that platform is covered by its own job entry.
      - name: the functional paths carry data
        if: runner.os == 'Linux'
        run: bash scripts/functional-linux.sh bin/aethertunnel-server bin/aethertunnel-client

      - name: the example configurations are valid, with no key this version does not know
        run: |
          ./bin/aethertunnel-server${{ matrix.exe }} --config server.toml.example --check --reject-unknown-keys
          ./bin/aethertunnel-client${{ matrix.exe }} --config client.toml.example --check --reject-unknown-keys

      - name: the binaries report their version
        run: ./bin/aethertunnel-server${{ matrix.exe }} --version

      # The end-to-end operations script starts a server, an owner client and visitor
      # clients as real processes and drives every proxy type, the security layers,
      # the probes, the metrics and the audit log. It is written for Windows, where
      # the second loopback address and icacls-based failure injection it uses exist.
      - name: the operations script passes end to end
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test.ps1

  # The six release targets are cross-compiled above, which proves they build and
  # nothing more. This job executes one of them on real arm64 hardware: the four arm64
  # artifacts are otherwise never run by any workflow, on any machine.
  test-arm64:
    name: test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: uname
        run: uname -m

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -timeout 300s

      - name: build
        run: |
          go build -o bin/aethertunnel-server .
          go build -o bin/aethertunnel-client ./client

      - name: the example configurations are valid, with no key this version does not know
        run: |
          ./bin/aethertunnel-server --config server.toml.example --check --reject-unknown-keys
          ./bin/aethertunnel-client --config client.toml.example --check --reject-unknown-keys

      - name: the binaries report their version
        run: |
          ./bin/aethertunnel-server --version
          ./bin/aethertunnel-client --version

      # A real transfer through a real tunnel on this architecture, and every other
      # functional path with it: the steps above only show that the binaries start,
      # and this shows they carry data. It is the same script the ubuntu-latest job
      # runs, on arm64 hardware instead of an emulator.
      - name: the functional paths carry data on arm64
        run: |
          uname -m
          bash scripts/functional-linux.sh bin/aethertunnel-server bin/aethertunnel-client

  mobile:
    name: mobile (android and ios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # The client is a library (pkg/clientlib) behind the command and behind the
      # mobile bindings (pkg/mobile), so the surface an embedding app consumes has
      # to compile on the platforms such an app ships for.
      - name: the client library and mobile bindings compile for android and ios
        run: |
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./pkg/...
          CGO_ENABLED=0 GOOS=ios GOARCH=arm64 go build ./pkg/...

      # An android executable needs -checklinkname=0 because the interface
      # enumeration helper pion/webrtc pulls in uses go:linkname; see pkg/mobile.
      - name: the client executable builds for android
        run: |
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -ldflags "-checklinkname=0" -o /tmp/aethertunnel-client-android ./client
          file /tmp/aethertunnel-client-android | grep -q 'ARM aarch64'

      # An ios executable needs Apple's own cgo toolchain, which the ios linker
      # requires for any Go program and a Linux runner does not have; a real iOS
      # app consumes the library through gomobile or Xcode instead.
      - name: the ios library level builds
        run: |
          CGO_ENABLED=0 GOOS=ios GOARCH=arm64 go build ./pkg/clientlib ./pkg/mobile

  delivery:
    name: delivery (image and manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifests are rendered without a cluster, which is what catches a broken
      # kustomization, a missing file or a mistyped resource name.
      - name: the Kubernetes manifests render
        run: |
          kubectl kustomize deploy/kubernetes > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          for kind in Namespace ConfigMap Deployment Service; do
            grep -q "^kind: $kind$" /tmp/rendered.yaml || { echo "the render has no $kind"; exit 1; }
          done
          grep -q 'name: aethertunnel-server' /tmp/rendered.yaml
          echo "the manifests render into $(grep -c '^kind: ' /tmp/rendered.yaml) objects"

      - name: build the container image
        run: docker build -t aethertunnel:ci .

      # The image is distroless: it has no shell, so the check is that the server
      # itself comes up and answers its own probes.
      - name: the image starts and answers its probes
        run: |
          cat > /tmp/ci-server.toml <<'EOF'
          [server]
          bind_addr = "0.0.0.0"
          bind_port = 7001
          auth_token = "ci-token-that-is-long-enough"

          [dashboard]
          enabled = true
          bind_addr = "0.0.0.0"
          port = 7500
          token = "ci-dashboard-token"
          EOF
          docker run -d --name aethertunnel-ci -p 17500:7500 \
            -v /tmp/ci-server.toml:/etc/aethertunnel/server.toml:ro \
            aethertunnel:ci
          ready=''
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17500/healthz > /dev/null; then ready=yes; break; fi
            sleep 1
          done
          docker logs aethertunnel-ci
          docker rm -f aethertunnel-ci
          test -n "$ready" || { echo "the container never answered /healthz"; exit 1; }
          echo "the container answered its probes"
