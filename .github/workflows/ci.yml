name: CI

# Runs on every push and pull request. The old test workflow ran gosec/golint with
# `@latest` (both unmaintained, and gosec fails the job on any finding), and the
# build workflow tried `go get` on a module that go.mod replaced with a local stub.
# This workflow runs only what the project actually needs: fmt check, vet, tests,
# and a native build on all three supported systems.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.24 is the minimum: the post-quantum key agreement uses crypto/mlkem
          # from the standard library, which first shipped in that release. The
          # macOS job also needs 1.23 or later, because 1.22's linker omitted
          # LC_UUID and the dyld on macos-latest refuses to run such binaries.
          - os: ubuntu-latest
            go: '1.24'
            exe: ''
          - os: windows-latest
            go: '1.24'
            exe: '.exe'
          - os: macos-latest
            go: '1.24'
            exe: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -timeout 300s

      # The tun device binding is compiled only on Linux, so a change there is
      # invisible to a build on any other platform. This cross-build is what keeps
      # every supported target compiling.
      - name: every release target compiles
        if: runner.os == 'Linux'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
            echo "built $target"
          done

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test ./... -count=1 -race -timeout 600s

      # -o with an explicit name does not append .exe on Windows, so the suffix is
      # part of the artifact name on every platform.
      - name: build
        run: |
          go build -o bin/aethertunnel-server${{ matrix.exe }} .
          go build -o bin/aethertunnel-client${{ matrix.exe }} ./client

      - name: the example configurations are valid
        run: |
          ./bin/aethertunnel-server${{ matrix.exe }} --config server.toml.example --check
          ./bin/aethertunnel-client${{ matrix.exe }} --config client.toml.example --check

      - name: the binaries report their version
        run: ./bin/aethertunnel-server${{ matrix.exe }} --version
