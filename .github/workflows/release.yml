name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v3.1.0 && git push origin v3.1.0
#
# The v1 setup had two workflows (one on `release: created`, one on
# `release: published`) that both uploaded the same asset names to the same
# release, so the second one always failed with a 422, and it also used the
# archived actions/upload-release-asset@v1 with wrong download-artifact paths.
# Here a single job builds the matrix, verifies it, and creates the release with
# the `gh` CLI that is already on the runner.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  # The end-to-end operations script runs against the tagged source before anything is
  # published. It starts a server, an owner client and visitor clients as real
  # processes, drives every proxy type and the optional security layers, and checks the
  # operational surface a release is judged on: the probes, the metrics, the audit log
  # and its failure handling. A failed run means no release is created.
  operations:
    name: operations (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: the operations script passes end to end
        shell: pwsh
        run: ./scripts/smoke-test.ps1

  release:
    needs: operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: tests must pass before a release
        run: go test ./... -count=1 -timeout 180s

      - name: cross-compile the matrix
        run: |
          bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: verify every artifact is a real binary of the right format
        run: |
          set -e
          check() {
            file --brief "$1" | grep -qi "$2" || { echo "$1 is not $2"; exit 1; }
          }
          check dist/aethertunnel-server-linux-amd64           'ELF 64-bit'
          check dist/aethertunnel-server-linux-arm64           'ELF 64-bit'
          check dist/aethertunnel-client-linux-amd64           'ELF 64-bit'
          check dist/aethertunnel-client-linux-arm64           'ELF 64-bit'
          check dist/aethertunnel-server-darwin-amd64          'Mach-O'
          check dist/aethertunnel-server-darwin-arm64          'Mach-O'
          check dist/aethertunnel-client-darwin-amd64          'Mach-O'
          check dist/aethertunnel-client-darwin-arm64          'Mach-O'
          check dist/aethertunnel-server-windows-amd64.exe     'PE32+'
          check dist/aethertunnel-server-windows-arm64.exe     'PE32+'
          check dist/aethertunnel-client-windows-amd64.exe     'PE32+'
          check dist/aethertunnel-client-windows-arm64.exe     'PE32+'
          echo "all 12 artifacts look correct"

      - name: record the version the binaries report
        run: |
          ./dist/aethertunnel-server-linux-amd64 --version
          ./dist/aethertunnel-client-linux-amd64 --version

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # The release notes are this version's own changelog section, not the
          # whole file: GitHub caps a release body at 125000 characters and the
          # changelog has outgrown that.
          awk -v header="## [$version]" '
            index($0, header) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "the changelog has no section for $version" >&2
            exit 1
          fi
          # Idempotent: a re-run after a partial failure finds the release already
          # there, and the assets must be the ones this run built.
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --title "AetherTunnel $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/aethertunnel-* dist/SHA256SUMS \
            server.toml.example client.toml.example
          echo "released $tag"

          # The Android artifacts are built by the mobile-app workflow's run on
          # this same tag. Waiting here — inside the job that owns the release —
          # removes the ordering race that lost these two files when the upload
          # lived in the mobile workflow and both sides recreated the release.
          tag="${{ github.ref_name }}"
          row=""
          run_id=""
          for _ in $(seq 1 120); do
            row=$(gh run list --workflow=mobile-app.yml --branch "$tag" --limit 1 \
              --json databaseId,status,conclusion \
              -q '.[0] | "\(.databaseId) \(.status)/\(.conclusion // "pending")"' 2>/dev/null || echo none)
            case "$row" in
              *"completed/success"*) run_id=${row%% *}; break ;;
              *"completed/"*) echo "the mobile-app run did not go green: $row"; exit 1 ;;
            esac
            sleep 10
          done
          [ -n "$run_id" ] || { echo "the mobile-app run never finished: $row"; exit 1; }
          gh run download "$run_id" -n app-debug-apk -D dist/mobile
          gh run download "$run_id" -n mobile-aar -D dist/mobile
          gh release upload "$tag" --clobber \
            dist/mobile/aethertunnel-mobile-android.aar \
            dist/mobile/aethertunnel-app-android-arm64-debug.apk
          names=$(gh release view "$tag" --json assets -q '.assets[].name')
          echo "$names" | grep -F aethertunnel-mobile-android.aar
          echo "$names" | grep -F aethertunnel-app-android-arm64-debug.apk
          echo "the release holds $(echo "$names" | grep -c .) assets"

  # Checks the release page itself, from a network that can download it: every
  # published file against SHA256SUMS, the version the published binaries report, the
  # example configurations shipped beside them, and then the whole operations script
  # against the two published Windows binaries. A red job here means the release page
  # does not hold what was built and tested, which is the one thing the jobs above
  # cannot show.
  verify:
    name: verify the published artifacts
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path published | Out-Null
          gh release download "${{ github.ref_name }}" --dir published
          Get-ChildItem published | Select-Object Name, Length | Format-Table -AutoSize

      - name: every published file matches SHA256SUMS
        shell: pwsh
        run: |
          $checked = 0
          foreach ($line in Get-Content published/SHA256SUMS) {
            if ($line.Trim() -eq '') { continue }
            $parts = $line -split '\s+'
            $want = $parts[0].ToLower()
            # The sums name their entries as ./<file>.
            $name = $parts[1] -replace '^\./', ''
            $path = "published/$name"
            if (-not (Test-Path $path)) { Write-Error "$name is listed in SHA256SUMS but was not uploaded"; exit 1 }
            $got = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $want) { Write-Error "$name does not match the hash published for it"; exit 1 }
            $checked++
          }
          Write-Host "$checked published files match SHA256SUMS"

      - name: the published binaries report the released version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          foreach ($name in @('aethertunnel-server-windows-amd64.exe', 'aethertunnel-client-windows-amd64.exe')) {
            $out = & "./published/$name" --version
            Write-Host $out
            if ($out -notmatch [regex]::Escape($tag)) { Write-Error "$name does not report $tag"; exit 1 }
          }

      - name: the published binaries accept the example configurations
        shell: pwsh
        run: |
          & ./published/aethertunnel-server-windows-amd64.exe --config published/server.toml.example --check
          if ($LASTEXITCODE -ne 0) { Write-Error "the published server refused its example configuration"; exit 1 }
          & ./published/aethertunnel-client-windows-amd64.exe --config published/client.toml.example --check
          if ($LASTEXITCODE -ne 0) { Write-Error "the published client refused its example configuration"; exit 1 }

      - name: the operations script passes against the published binaries
        shell: pwsh
        run: |
          ./scripts/smoke-test.ps1 `
            -ServerExe ./published/aethertunnel-server-windows-amd64.exe `
            -ClientExe ./published/aethertunnel-client-windows-amd64.exe

  # The same idea for the Linux artifacts, on a Linux kernel: the checks that cannot be
  # made on Windows live here, above all the audit log being renamed away underneath a
  # running server, which Windows refuses to do to an open file.
  verify-linux:
    name: verify the published linux artifacts
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The functional suite builds the smoketest helper from this checkout, so the
      # toolchain has to be here as well as the published binaries.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          gh release download "${GITHUB_REF_NAME}" --dir published \
            --pattern 'aethertunnel-*-linux-amd64' --pattern 'SHA256SUMS'
          chmod +x published/aethertunnel-*-linux-amd64
          ls -l published

      - name: run the published linux binaries
        run: bash scripts/verify-release-linux.sh "$PWD/published" "${GITHUB_REF_NAME}"

      # verify-release-linux.sh proves the probes, the audit log and the shutdown
      # behaviour of a published server. This adds the paths that carry data, run
      # against the published binaries rather than the ones built in CI.
      - name: the published linux binaries carry data
        run: |
          bash scripts/functional-linux.sh \
            "$PWD/published/aethertunnel-server-linux-amd64" \
            "$PWD/published/aethertunnel-client-linux-amd64"
