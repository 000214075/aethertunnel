name: mobile app

# Builds the Android artifacts from pkg/mobile: the gomobile binding (AAR) and the
# app skeleton under mobile/android (debug APK). Runs on every push to main so a
# broken binding or app build is caught without a tag, and on version tags, where
# both files are uploaded to the release the Release workflow creates.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: android (aar and apk)
    runs-on: ubuntu-latest
    env:
      XMV: v0.0.0-20260821151724-5c0595f4cdbb   # the newest x/mobile whose go directive the toolchain here satisfies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK and an NDK; only the path changes.
      - name: locate the NDK the runner already has
        run: |
          ls "$ANDROID_HOME/ndk"
          echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | head -1)" >> "$GITHUB_ENV"

      - name: install gomobile
        run: |
          go install "golang.org/x/mobile/cmd/gomobile@${XMV}"
          go install "golang.org/x/mobile/cmd/gobind@${XMV}"
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" version

      # gomobile bind needs golang.org/x/mobile in the module graph of the package it
      # binds, and the newest x/mobile forces a go-directive bump on whatever module
      # carries it. The main go.mod stays untouched: the binding runs from a throwaway
      # wrapper module that replaces the repository and pins a compatible x/mobile.
      - name: bind the client into an AAR
        env:
          REPO: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/binder mobile/android/app/libs
          cd /tmp/binder
          cat > go.mod <<EOF
          module aethertunnel/binder

          go 1.25.0

          require (
          	github.com/aethertunnel/aethertunnel v0.0.0
          	golang.org/x/mobile ${XMV}
          )

          replace github.com/aethertunnel/aethertunnel => ${REPO}
          EOF
          cat > binder.go <<EOF
          // Package binder holds only the module graph gomobile bind needs: the
          // repository under a replace, and x/mobile pinned to a version this
          // toolchain satisfies.
          package binder

          import (
          	_ "github.com/aethertunnel/aethertunnel/pkg/mobile"
          	_ "golang.org/x/mobile/bind"
          )
          EOF
          go mod tidy
          "$(go env GOPATH)/bin/gomobile" bind \
            -target=android/arm64,android/amd64 \
            -androidapi 21 \
            -javapkg=io.github.aethertunnel \
            -ldflags='-checklinkname=0' \
            -o "${REPO}/mobile/android/app/libs/aethertunnel.aar" \
            github.com/aethertunnel/aethertunnel/pkg/mobile
          unzip -l "${REPO}/mobile/android/app/libs/aethertunnel.aar" | grep -E 'classes\.jar|arm64-v8a/libgojni\.so|x86_64/libgojni\.so'
          cp "${REPO}/mobile/android/app/libs/aethertunnel.aar" "${REPO}/aethertunnel-mobile-android.aar"

      - name: build the app APK
        run: |
          curl -fsSL --retry 5 -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle -p mobile/android --no-daemon assembleDebug

      - name: the APK carries the bound library
        run: |
          apk=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libgojni\.so'
          unzip -l "$apk" | grep -q 'lib/x86_64/libgojni\.so'
          unzip -l "$apk" | grep -q 'classes\.dex'
          cp "$apk" aethertunnel-app-android-arm64-debug.apk
          ls -l aethertunnel-mobile-android.aar aethertunnel-app-android-arm64-debug.apk

      - name: hand the APK to the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: aethertunnel-app-android-arm64-debug.apk
          retention-days: 3

      - name: upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The Release workflow deletes and recreates the release; uploading before
          # it finishes would lose these two files along with the old release. Wait
          # for this tag's release run to complete, then append.
          s=none
          for _ in $(seq 1 120); do
            s=$(gh run list --workflow=release.yml --branch "$tag" --limit 1 \
              --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion // "pending")"' 2>/dev/null || echo none)
            case "$s" in
              completed/success) break ;;
              completed/*) echo "the release workflow did not go green: $s"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$s" = "completed/success" ] || { echo "the release workflow never finished: $s"; exit 1; }
          gh release upload "$tag" --clobber \
            aethertunnel-mobile-android.aar \
            aethertunnel-app-android-arm64-debug.apk
          names=$(gh release view "$tag" --json assets -q '.assets[].name')
          echo "$names" | grep -F aethertunnel-mobile-android.aar
          echo "$names" | grep -F aethertunnel-app-android-arm64-debug.apk
          echo "$names"

  android-e2e:
    name: android e2e (emulator)
    needs: android
    runs-on: ubuntu-latest
    env:
      # avdmanager and the emulator must agree on where AVDs live, or the emulator
      # looks in $HOME/.android/avd and reports an unknown AVD name.
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: take the APK the android job built
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      # The runner ships the SDK with KVM acceleration; the system image is the
      # one piece it does not carry, so fetch an x86_64 one — the APK carries an
      # x86_64 libgojni for exactly this.
      - name: fetch a system image and create the emulator
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "system-images;android-34;google_apis;x86_64" >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n ci -k "system-images;android-34;google_apis;x86_64"
          found=$(find /home /root /tmp -maxdepth 6 -name ci.ini 2>/dev/null | head -1)
          echo "avd ini: $found"
          [ -n "$found" ]
          dir=$(dirname "$found")
          if [ "$dir" != "$ANDROID_AVD_HOME" ]; then
            cp -r "$dir/." "$ANDROID_AVD_HOME/"
          fi
          ls "$ANDROID_AVD_HOME"

      - name: boot it headless
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -gpu swiftshader_indirect \
            -no-snapshot -no-audio -no-boot-anim -accel on &
          timeout 600 bash -c 'while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 5; done'
          adb shell getprop ro.build.version.release

      - name: install, launch, and hold the process to account
        run: |
          adb install -r app-debug.apk
          out=$(adb shell am start -W -n io.github.aethertunnel.app/.MainActivity)
          echo "$out"
          echo "$out" | grep -q 'Status: ok'
          sleep 5
          pid=$(adb shell pidof io.github.aethertunnel.app | tr -d '\r')
          [ -n "$pid" ] || { echo "the app process is gone"; exit 1; }
          echo "pid: $pid"
          # The warm-up in onCreate loads libgojni; a broken binding would have
          # crashed the process into a FATAL EXCEPTION by now.
          if adb logcat -d | grep -qE 'FATAL EXCEPTION|UnsatisfiedLinkError'; then
            adb logcat -d | grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError' | head -20
            exit 1
          fi
          echo "the activity is up and the Go runtime is loaded"
